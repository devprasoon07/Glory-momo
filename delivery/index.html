<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Delivery Navigation & Orders · Glory Momo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Big+Shoulders+Display:wght@700;800;900&family=DM+Mono:wght@500&family=Karla:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="delivery.css" />
</head>
<body>
  <header class="bar is-stuck">
    <div class="bar__in">
      <div class="brand">
        <a href="../index.html" class="brand__mark" aria-label="Glory Momo home">
          <svg class="ico" width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="14" fill="#C4441C" />
            <path d="M9 16c2-4 12-4 14 0-1 6-13 6-14 0z" fill="#EFE2C6" />
            <path d="M13 13c1-2 5-2 6 0" stroke="#0E141A" stroke-width="1.5" fill="none" stroke-linecap="round" />
          </svg>
        </a>
        <div class="brand__name">
          <span class="brand__en">Glory Rider</span>
          <span class="brand__bn" lang="bn">ডেলিভারি ড্যাশবোর্ড</span>
        </div>
      </div>
      <div class="bar__end">
         <span id="rider-name" style="font-weight:600; color:var(--turmeric); font-size:0.88rem;">🛵 Delivery Partner</span>
         <button class="btn btn--ghost" id="btn-logout" style="padding:6px 14px; font-size:0.85rem;">Logout</button>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-top: 96px; padding-bottom: 60px;">
    <!-- Live GPS Broadcasting Controller -->
    <div class="track-box" id="loc-box">
      <div class="indicator" id="loc-dot"></div>
      <div style="flex:1;">
        <span id="loc-text" style="display:block; font-weight:700; font-size:0.95rem;">Location sharing idle</span>
        <small id="loc-sub" style="display:block; color:var(--steel-400); font-size:0.8rem; margin-top:2px;">Turn on GPS to broadcast live updates to customers</small>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn--hot" id="btn-toggle-loc">Start Real GPS 📍</button>
        <button class="btn btn--ghost" id="btn-sim-loc" style="border-color:var(--turmeric); color:var(--turmeric);">Simulate Route 🛵</button>
      </div>
    </div>

    <!-- Active Rider Navigation Map -->
    <div class="del-map-card" style="margin-top: 24px; background:var(--steel-900); border:1px solid var(--steel-700); border-radius:var(--r); overflow:hidden;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--steel-800); background:var(--steel-850, #172129);">
        <div>
          <strong style="color:var(--steel-050); font-size:0.95rem;">🗺️ Rider Navigation & Route Guide</strong>
          <span style="display:block; font-size:0.78rem; color:var(--steel-400);">Live GPS path from Newtown stall to customer doorstep</span>
        </div>
        <span id="nav-dist-badge" style="font-family:var(--ff-mono); font-size:0.82rem; color:var(--turmeric); font-weight:700;">Fastest Route</span>
      </div>
      <div id="delivery-map" style="height: 320px; width:100%;"></div>
    </div>

    <div class="head" style="margin-top: 36px; margin-bottom: 16px;">
      <h2 class="head__title">Active Assigned Deliveries</h2>
    </div>

    <div id="del-orders">
      <p style="color:var(--steel-400);">Loading deliveries...</p>
    </div>
  </main>

  <script type="module" src="./delivery.js"></script>
</body>
</html>
